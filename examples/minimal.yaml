type: custom:house-power-flow-card
title: Energy overview
subtitle: Live status

# Replace these with your own Home Assistant entity IDs.
solar_power: sensor.your_solar_power
grid_power: sensor.your_grid_power
weather: weather.home

# HACS installs the supplied scenes automatically.
automatic_images: true
image_directory: /hacsfiles/House-Powerflow-Card/images

# Holiday scenes are opt-in.
holidays:
  enabled: false
  country: NL
