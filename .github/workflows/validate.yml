name: Validate card

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check energy-house-aligned-v47-card.js

      - name: Verify weather image set
        shell: bash
        run: |
          count="$(find images -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$count" -eq 34
